name: Deploy to production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmo_user
          POSTGRES_PASSWORD: ${{ secrets.PG_PASSWORD }}
          POSTGRES_DB: pmo
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql://pmo_user:${{ secrets.PG_PASSWORD }}@127.0.0.1:5432/pmo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Single root install ON PURPOSE: this repo uses npm workspaces, so
      # `cd backend && npm ci` / `cd frontend && npm ci` each REPLACE the
      # whole root node_modules with that member's lockfile tree (the second
      # one wiped `pg` and broke Apply migrations). One root `npm ci` installs
      # the full tree (backend prod + frontend build tools) from the root lock.
      - name: Install deps
        run: npm ci
      - name: Verify backend deps resolve
        run: node -e "import('pg').then(() => console.log('pg ok'))"
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Apply migrations
        run: node backend/src/db/init.js
      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/pmo_project
            git pull origin main
            cd backend && npm ci --omit=dev
            cd ../frontend && npm ci && npm run build
            sudo systemctl restart pmo-backend
            sleep 3
            curl -fsS http://localhost:3000/api/health
