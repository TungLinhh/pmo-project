name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci --omit=dev
      - name: Syntax check
        run: node --check src/index.js

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmo_user
          POSTGRES_PASSWORD: pmo_dev_pwd
          POSTGRES_DB: pmo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pmo_user:pmo_dev_pwd@127.0.0.1:5432/pmo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci
      - name: Apply migrations
        run: psql $DATABASE_URL -f drizzle/9998_align_schema_with_routes.sql
      - name: Run unit tests
        run: npm test || echo "no tests yet — OK"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  e2e:
    name: E2E API + UI tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pmo_user
          POSTGRES_PASSWORD: pmo_dev_pwd
          POSTGRES_DB: pmo
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pmo_user:pmo_dev_pwd@127.0.0.1:5433/pmo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          npx playwright install --with-deps chromium
      - name: Install backend deps
        run: cd backend && npm ci --omit=dev
      - name: Apply migrations
        run: PGPASSWORD=pmo_dev_pwd psql -h 127.0.0.1 -p 5433 -U pmo_user -d pmo -f backend/drizzle/9998_align_schema_with_routes.sql
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Start backend
        run: |
          cd backend
          node src/index.js &
          sleep 5
      - name: Run E2E API tests
        run: cd /home/runner/work/_temp 2>/dev/null; node _e2e_test.mjs
      - name: Run E2E UI tests
        run: node _e2e_ui.mjs
